# Unattended work loop: the GitHub worker
#
# Wakes every four hours on GitHub Actions and works only when there is a
# reason to: instructions waiting on an issue, a person's answer on a
# `needs Chris` issue, or a review pass once the map on main has changed
# (.github/daily/pick.mjs). With no reason it stops in seconds, before
# installing anything or calling a model. One job per run, done by the
# opencode CLI on DeepSeek V4.1 Flash. When the model ends its turn
# before the job is done (no daily-summary.txt), it is told to carry on
# in the same session, up to five times. Then .github/daily/finish.mjs
# reads what the run really did from GitHub, sets the issue's labels so
# nothing comes back to the worker by itself, and the ledger and the
# Agent log comment go up. Map changes stay on branches; docs, tests and
# CI may go to main fast-forward. The evaluator on the home machine is
# the only thing that talks to Chris; this workflow never alerts him.
#
# Setup: the repository secret OPENCODE_GO_API_KEY (the Go subscription
# key). Pushes made with GITHUB_TOKEN do not start other workflows, so
# the agent starts the branch-preview checks itself.
name: Agent

on:
  schedule:
    - cron: '13 */4 * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to work on (optional; runs even with nothing waiting)'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  agent:
    # Pinned for the same reason as the check workflows: Playwright 1.55.1
    # has no build for Ubuntu 26.04, which ubuntu-latest now is.
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      # Scheduled runs have no inputs, so they always use DeepSeek.
      MODEL: deepseek-v4.1-flash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Pick the job, or none
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_INPUT: ${{ inputs.issue }}
        run: |
          # The worker's own scripts, copied out of the checkout so the later
          # steps still find them after the agent switches branches.
          cp -r .github/daily "$RUNNER_TEMP/daily"
          if [ -n "$ISSUE_INPUT" ]; then
            node .github/daily/pick.mjs --issue "$ISSUE_INPUT" > job.json
          else
            node .github/daily/pick.mjs > job.json
          fi
          cat job.json
          echo "JOB=$(python3 -c 'import json; print(json.load(open("job.json"))["job"])')" >> "$GITHUB_OUTPUT"
          python3 -c 'import json; j=json.load(open("job.json")); print("**" + j["job"] + "**: " + j.get("summary","") + " (" + j.get("reason","") + ")")' >> "$GITHUB_STEP_SUMMARY"
      - if: steps.pick.outputs.JOB != 'none'
        run: npm ci
      - if: steps.pick.outputs.JOB != 'none'
        run: npx playwright install --with-deps chromium
      - if: steps.pick.outputs.JOB != 'none'
        run: npm run build
      - if: steps.pick.outputs.JOB != 'none'
        run: pip install pillow
      - name: Install opencode (pinned)
        if: steps.pick.outputs.JOB != 'none'
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.19.5
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Serve the site
        if: steps.pick.outputs.JOB != 'none'
        run: |
          npx wrangler pages dev public --port 8797 > pages-dev.log 2>&1 &
          echo $! > pages-dev.pid
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8797/data/meta.json >/dev/null && break
            sleep 2
          done
          curl -fs http://127.0.0.1:8797/data/meta.json >/dev/null && echo "site up" || (cat pages-dev.log; exit 1)
      - name: Run the agent
        if: steps.pick.outputs.JOB != 'none'
        id: agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          CHECK_URL: http://127.0.0.1:8797
        run: |
          # What the run starts from, so finish.mjs can tell what it did.
          git ls-remote --heads origin > "$RUNNER_TEMP/refs-before.txt"
          echo "START=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          # Brief = the ground rules (CLAUDE.md is in the repo) plus the
          # job brief.
          JOB=$(python3 -c "import json; print(json.load(open('job.json'))['job'])")
          if [ "$JOB" = "find" ]; then
            LENS=$(python3 -c "import json; print(json.load(open('job.json')).get('lens','rail'))")
            BRIEF=$(cat .github/daily/find.md)
            ASSIGN="Lens: $LENS. Read it from .github/daily/lenses.json."
          else
            BRIEF=$(cat .github/daily/fix.md)
            ASSIGN=$(python3 -c "import json; j=json.load(open('job.json')); print('Issue: #'+str(j.get('issue'))+' branch='+(j.get('branch') or 'new')+' kind='+str(j.get('kind')))")
          fi
          PROMPT_FILE="$RUNNER_TEMP/brief.txt"
          { echo "You are working on datapolitical/rtd-system-map. Read CLAUDE.md in the worktree root and DESIGN.md before changing anything."; echo; echo "$BRIEF"; echo; echo "## Today's assignment"; echo "$ASSIGN"; echo "Date: $(date -u +%F). Run folder: $PWD/run."; } > "$PROMPT_FILE"
          mkdir -p run
          # Credit every commit, comment and issue to the model that made it
          # (.github/daily/madeby).
          source "$RUNNER_TEMP/daily/madeby/madeby.sh"
          made_by "$MODEL"
          # The job is done when the agent has written daily-summary.txt
          # (both briefs end with it). A model that ends its turn before
          # then is told to carry on in the same session.
          DONE="$GITHUB_WORKSPACE/daily-summary.txt"
          rm -f "$DONE"
          NUDGE="$RUNNER_TEMP/nudge.txt"
          echo "You ended your turn before the job was finished, and nobody will answer you. Carry on from where you stopped and do the work now. End your turn only when the job is finished and daily-summary.txt is written in the worktree root, or when you are truly blocked (say why in daily-summary.txt)." > "$NUDGE"
          END=$(( $(date +%s) + 4 * 3600 ))
          FINISHED=no; MODEL_ERROR=no; TRIES=0
          for try in 1 2 3 4 5 6; do
            LEFT=$(( END - $(date +%s) ))
            if [ "$LEFT" -lt 300 ]; then echo "out of time"; break; fi
            TRIES=$try; T0=$(date +%s); RC=0
            if [ "$try" = 1 ]; then
              timeout "$LEFT" opencode run -m "opencode-go/$MODEL" < "$PROMPT_FILE" >> run/agent.log 2>&1 || RC=$?
            else
              echo "--- try $try: told to carry on" >> run/agent.log
              timeout "$LEFT" opencode run --continue -m "opencode-go/$MODEL" < "$NUDGE" >> run/agent.log 2>&1 || RC=$?
            fi
            SECS=$(( $(date +%s) - T0 ))
            echo "try $try: exit $RC after ${SECS}s" | tee -a run/tries.txt
            if [ -s "$DONE" ]; then FINISHED=yes; break; fi
            # An error straight away (the service down, the key refused) will
            # not get better by asking again; the next run tries again.
            if [ "$RC" -ne 0 ] && [ "$SECS" -lt 120 ]; then MODEL_ERROR=yes; break; fi
          done
          [ -s "$DONE" ] && cp "$DONE" run/daily-summary.txt
          { echo "FINISHED=$FINISHED"; echo "MODEL_ERROR=$MODEL_ERROR"; echo "TRIES=$TRIES"; } >> "$GITHUB_OUTPUT"
          echo "$MODEL: $TRIES tries, finished: $FINISHED, model error: $MODEL_ERROR" >> "$GITHUB_STEP_SUMMARY"
      - name: Stop the site
        if: always()
        run: |
          if [ -f pages-dev.pid ]; then kill "$(cat pages-dev.pid)" 2>/dev/null || true; fi
      - name: Upload captures
        if: always() && steps.pick.outputs.JOB != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: agent-${{ github.run_id }}
          path: |
            qa/.scratch/
            qa/report/
            run/
          if-no-files-found: warn
      - name: See what the run did and set the labels
        if: always() && steps.pick.outputs.JOB != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_FILE: job.json
          REFS_BEFORE: ${{ runner.temp }}/refs-before.txt
          RUN_START: ${{ steps.agent.outputs.START }}
          FINISHED: ${{ steps.agent.outputs.FINISHED }}
          MODEL_ERROR: ${{ steps.agent.outputs.MODEL_ERROR }}
          TRIES: ${{ steps.agent.outputs.TRIES }}
          SUMMARY_FILE: run/daily-summary.txt
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node "$RUNNER_TEMP/daily/finish.mjs"
      - name: Write the ledger
        if: always() && steps.pick.outputs.JOB != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os
          j = json.load(open('job.json'))
          if os.path.exists('outcome.json'):
              o = json.load(open('outcome.json'))
              for k in ('finished', 'output', 'tries', 'filed', 'evaluation'):
                  j[k] = o.get(k)
          json.dump(j, open('job-ledger.json', 'w'))
          PY
          node "$RUNNER_TEMP/daily/ledger.mjs" job-ledger.json "$MODEL"
      - name: Post the Agent log comment
        if: always() && steps.pick.outputs.JOB != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f outcome.json ]; then
            BODY=$(python3 -c 'import json; print(json.load(open("outcome.json"))["line"])')
          else
            BODY="Agent log: $(python3 -c 'import json; print(json.load(open("job.json")).get("summary","run"))') — the run broke before it could say what it did. [Run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          fi
          # Find or create the single log issue.
          NUM=$(gh issue list --label "found daily" --limit 100 --json number,title --jq '.[] | select(.title=="Agent log") | .number' | head -1)
          if [ -z "$NUM" ]; then
            URL=$(gh issue create --title "Agent log" --label "found daily" --milestone "V3 roadmap" --body "One line per run: job, model, why it ran, what it did.")
            NUM=$(basename "$URL")
          fi
          gh issue comment "$NUM" --body "$BODY"
          echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
