# On every push to main and every pull request: the unit tests (npm test),
# which are plain Node and need no browser, network data or build; and a
# dry-run bundle of the Worker deployed by hand (the Live relay), so a broken
# import fails here rather than at deploy. The data is built on our machine
# and uploaded with npm run deploy (docs/upkeep.md); it is not in git, so
# the few tests that read the built map skip here (test/pages.test.mjs).
# Sheet-map health checks run in checks-nightly.yml against the live site.
# Branch browser checks remain manual unless their disabled workflow is enabled.
# And the recall score (npm run check:recall, qa/recall/README.md): the map
# checks run over frozen builds, scored against faults people found and
# faults planted on purpose; it fails when a change catches fewer of them.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  recall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Score the checks against known and planted faults
        run: npm run check:recall
      - name: Upload the score
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recall-${{ github.run_id }}
          path: qa/recall/out/
          if-no-files-found: ignore

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle the Live relay
        run: npx --yes wrangler@4.80.0 deploy --dry-run --outdir "$RUNNER_TEMP/live" --config live/wrangler.toml
