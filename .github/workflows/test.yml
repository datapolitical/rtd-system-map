# The unit tests (npm test) on every push to main and every pull request.
# They are plain Node and need no browser, network data or build. The
# headless browser checks (npm run check) need a running site and stay local.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
