# TEMPORARY (issue #31 diagnosis). Runs one diagnostic spec against the live
# site and prints what the map has drawn. Not part of the checks; deleted
# once the failure is understood.
name: Checks (diagnose)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Diagnose
        env:
          CHECK_URL: https://rtd-system-map.pages.dev
        run: npx playwright test -c qa/playwright.config.mjs letters-diag --project=phone-light --reporter=list
