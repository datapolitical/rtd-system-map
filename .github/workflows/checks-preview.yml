# On every push to a branch but main: wait for that commit's Cloudflare Pages
# preview, run the fast browser checks against it, capture the design review's
# fixed views in both themes on one contact sheet, run the map checks on the
# preview and on main and post what the branch changes (checks/map), and leave
# all of it in the run's artifact. A failing spec opens or comments on its "found by checks"
# issue; the run's one-line result is a commit status named checks/preview.
# Quiet runs finish green without touching anything.
name: Checks (branch preview)

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: checks-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Pinned: Playwright 1.55.1 has no build for Ubuntu 26.04, which
    # ubuntu-latest now is.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for this commit's Cloudflare Pages preview
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node qa/checks/preview.mjs
      - name: Run the fast checks against the preview
        if: steps.preview.outputs.url != ''
        env:
          CHECK_URL: ${{ steps.preview.outputs.url }}
          CHECK_JSON: qa/report/results.json
          # drawn.spec.mjs: four seeded views per theme in CI (643b40e on the
          # evaluator branch). #59 is what this test should check, and on how many views.
          DRAWN_VIEWS: 4
        run: npm run check
      # The map checks (npm run check:map, issue #45) on this branch's preview
      # and on main's live site, both by this branch's checks with each site's
      # own page code, so the difference is the map: a commit status named
      # checks/map fails when the branch adds a fault main doesn't have.
      - name: Map checks on the preview and on main, and what this branch changes
        if: always() && steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW: ${{ steps.preview.outputs.url }}
        run: |
          git fetch --depth 1 origin main
          git worktree add --detach "$RUNNER_TEMP/main" FETCH_HEAD
          ln -s "$GITHUB_WORKSPACE/public/vendor" "$RUNNER_TEMP/main/public/vendor"
          CHECK_URL="$PREVIEW" node qa/checks/report.mjs --out qa/findings/branch
          CHECK_URL=https://rtd-system-map.pages.dev node qa/checks/report.mjs --root "$RUNNER_TEMP/main" --out qa/findings/main
          node qa/checks/map-diff.mjs --base qa/findings/main/findings.json --head qa/findings/branch/findings.json --out qa/findings --status
      - name: Capture the design review's fixed views
        if: always() && steps.preview.outputs.url != ''
        env:
          CHECK_URL: ${{ steps.preview.outputs.url }}
        run: node qa/checks/review-captures.mjs --out qa/review
      - name: Upload the report, captures and contact sheet
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checks-preview-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            qa/report/
            qa/checks/out/
            qa/review/
            qa/findings/
          if-no-files-found: warn
      - name: Open or comment on the issue for each failing spec
        if: always() && steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node qa/checks/github.mjs issues --site "${{ steps.preview.outputs.url }} (branch ${{ github.ref_name }})"
      - name: Post the result as a commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_PREVIEW: ${{ steps.preview.outcome == 'success' && steps.preview.outputs.url == '' }}
        run: node qa/checks/github.mjs status
