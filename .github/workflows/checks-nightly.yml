# The nightly watchdog: the live site rebuilds from RTD's data with nobody
# watching, so each night the page health check (qa/checks/health.spec.mjs)
# loads it and fails on a console error, a failed request or a style error.
# A failure opens an issue labelled "found by checks" with a link to the run;
# a pass closes it. The other browser checks and the map checks no longer run
# here: Chris stopped them on 2026-11-13 because they failed every night
# without finding faults he hadn't, and slowed work down. They can still be
# run by hand (npm run check, npm run check:map).
name: Checks (nightly)

on:
  schedule:
    # 01:20 in Denver in winter (02:20 in summer); a quiet hour, and after
    # Cloudflare's own hourly rebuild has had time to finish.
    - cron: '20 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: checks-nightly
  cancel-in-progress: false

jobs:
  checks:
    # Pinned: Playwright 1.55.1 has no build for Ubuntu 26.04, which
    # ubuntu-latest now is.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: The page health check against the live site
        env:
          CHECK_URL: https://rtd-system-map.pages.dev
          CHECK_JSON: qa/report/results.json
        run: npx playwright test -c qa/playwright.config.mjs health --grep-invert @deep
      - name: Upload the report and captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checks-nightly-${{ github.run_id }}
          path: |
            qa/report/
            qa/checks/out/
          if-no-files-found: warn
      - name: Open, comment on or close the issue for each spec
        if: always() && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node qa/checks/github.mjs issues --site "https://rtd-system-map.pages.dev" --close
