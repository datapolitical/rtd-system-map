<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>RTD system map</title>
<meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e141d" media="(prefers-color-scheme: dark)">
<meta name="description" content="An easy-to-read map of RTD bus and rail service in the Denver region, showing how often each route runs.">
<!-- What a shared link shows in messages and social posts (DESIGN.md, "Link preview"). The picture is made by scripts/og-image.mjs. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="RTD system map">
<meta property="og:title" content="RTD system map">
<meta property="og:description" content="An easy-to-read map of RTD bus and rail service in the Denver region, showing how often each route runs.">
<meta property="og:url" content="https://rtd-system-map.pages.dev/">
<meta property="og:image" content="https://rtd-system-map.pages.dev/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Map of central Denver with the colored rail lines meeting at Union Station and the bus streets beside them.">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<style>
  @font-face { font-family: Overpass; src: url(/vendor/overpass-latin.woff2) format('woff2'); font-weight: 100 900; font-display: block; }
  :root { --ground: #f5f3ef; --card: #ffffff; --ink: #161c28; --quiet: #8b8f98; }
  @media (prefers-color-scheme: dark) { :root { --ground: #0e141d; --card: #1a222e; --ink: #f3f5f9; --quiet: #5f6b82; } }
  html, body, #map { margin: 0; height: 100%; background: var(--ground); }
  body { font-family: Overpass, system-ui, sans-serif; overscroll-behavior: none; }
  #steps { position: absolute; left: max(12px, env(safe-area-inset-left)); bottom: max(28px, calc(env(safe-area-inset-bottom) + 20px)); display: flex; align-items: center;
    background: var(--card); border-radius: 22px; box-shadow: 0 1px 8px rgb(0 0 0 / 0.28); }
  #steps button { all: unset; width: 44px; height: 44px; text-align: center; font-size: 24px; line-height: 44px; color: var(--ink); cursor: pointer; }
  #steps button:disabled { color: var(--quiet); opacity: 0.5; }
  #sheets { display: flex; gap: 6px; padding: 0 2px; }
  #sheets i { width: 5px; height: 5px; border-radius: 50%; background: var(--quiet); opacity: 0.5; }
  #sheets i.on { background: var(--ink); opacity: 1; }
  #credit { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(8px, env(safe-area-inset-bottom)); font-size: 10px; color: var(--quiet); padding: 2px 6px; margin-left: -6px; border-radius: 8px; background: color-mix(in srgb, var(--ground) 82%, transparent); }
  #credit a { color: inherit; }
  #card { position: absolute; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); bottom: max(84px, calc(env(safe-area-inset-bottom) + 76px)); max-width: 420px; padding: 12px 14px; background: var(--card); color: var(--ink);
    border-radius: 14px; box-shadow: 0 1px 8px rgb(0 0 0 / 0.28); }
  #card[hidden] { display: none; }
  #card b { display: block; font-size: 15px; font-weight: 700; line-height: 1.25; }
  #card span { display: block; margin-top: 3px; font-size: 12.5px; color: var(--quiet); line-height: 1.3; }
  #card i { display: inline-block; min-width: 1.5em; height: 1.5em; margin-right: 6px; border-radius: 0.75em; text-align: center; font-style: normal; line-height: 1.55em; }
</style>
</head>
<body>
<div id="map"></div>
<div id="steps" role="group" aria-label="Map sheet">
  <button id="out" aria-label="Wider sheet">&minus;</button>
  <div id="sheets" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <button id="in" aria-label="Closer sheet">+</button>
</div>
<div id="card" role="status" hidden></div>
<div id="credit">Unofficial. Data: RTD · <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · <a href="https://openfreemap.org">OpenFreeMap</a> · <a href="/classic/">Classic map</a></div>
<script type="module" src="/js/sheets/main.js"></script>
</body>
</html>
