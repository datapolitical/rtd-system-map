<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>RTD system map</title>
<meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e141d" media="(prefers-color-scheme: dark)">
<meta name="description" content="An easy-to-read map of RTD bus and rail service in the Denver region, showing how often each route runs.">
<!-- What a shared link shows in messages and social posts (DESIGN.md, "Link preview"). The picture is made by scripts/og-image.mjs. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="RTD system map">
<meta property="og:title" content="RTD system map">
<meta property="og:description" content="An easy-to-read map of RTD bus and rail service in the Denver region, showing how often each route runs.">
<meta property="og:url" content="https://rtd-system-map.pages.dev/">
<meta property="og:image" content="https://rtd-system-map.pages.dev/og.png?v=3">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Dark map of central Denver: the colored rail lines fanning out from Union Station past Ball Arena and Empower Field.">
<meta name="twitter:card" content="summary_large_image">
<script>
  // The loading picture (#poster below) is asked for first, before anything the map needs: it is
  // what the reader sees until the map is drawn. Only on a plain visit; a link to a view, or a theme
  // the address forces, shows no picture. Before the stylesheet, so this runs without waiting for it.
  if (!location.hash && !new URLSearchParams(location.search).has('theme')) {
    const theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    const link = Object.assign(document.createElement('link'), { rel: 'preload', as: 'image', fetchPriority: 'high' });
    if (matchMedia('(max-width: 600px)').matches) link.href = `/poster/phone-${theme}.webp`;
    else link.imageSrcset = `/poster/wide-${theme}-1x.webp 1x, /poster/wide-${theme}-2x.webp 2x`;
    document.head.append(link);
  }
</script>
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<!-- Everything the opening view needs is asked for here, at once, instead of each file waiting
     for the one that names it (DESIGN.md, "Quality floor"). The sheet and the glyphs are fetched
     by the map's worker, which finds them in the browser's cache. -->
<link rel="modulepreload" href="/vendor/maplibre-gl.mjs">
<link rel="modulepreload" href="/js/sheets/style.js">
<link rel="modulepreload" href="/js/sheets/settle.js">
<link rel="modulepreload" href="/js/sheets/pick.js">
<link rel="modulepreload" href="/js/sheets/address.js">
<link rel="modulepreload" href="/js/sheets/say.js">
<link rel="preload" href="/data/meta.json" as="fetch" crossorigin="anonymous">
<link rel="preload" href="/data/sheets.json" as="fetch" crossorigin="anonymous">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preload" href="https://tiles.openfreemap.org/planet" as="fetch" crossorigin="anonymous">
<link rel="preload" href="/data/sheet-1.geojson" as="fetch" crossorigin="anonymous">
<link rel="preload" href="/vendor/glyphs/Overpass%20Medium/0-255.pbf" as="fetch" crossorigin="anonymous">
<link rel="preload" href="/vendor/glyphs/Overpass%20SemiBold/0-255.pbf" as="fetch" crossorigin="anonymous">
<link rel="preload" href="/vendor/glyphs/Overpass%20ExtraBold/0-255.pbf" as="fetch" crossorigin="anonymous">
<!-- The font early too: the loading line is set in it, and a block-display font shows nothing until it arrives. -->
<link rel="preload" href="/vendor/overpass-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: Overpass; src: url(/vendor/overpass-latin.woff2) format('woff2'); font-weight: 100 900; font-display: block; }
  /* --note is the card's and the credit's quieter text, and --rim a route button's ring: AA on the card and the ground in both themes (#14). */
  :root { --ground: #f5f3ef; --card: #ffffff; --ink: #161c28; --quiet: #8b8f98; --note: #656a74; --rim: #8b8f98; }
  @media (prefers-color-scheme: dark) { :root { --ground: #0e141d; --card: #1a222e; --ink: #f3f5f9; --quiet: #5f6b82; --note: #8592a6; --rim: #6c7890; } }
  html, body, #map { margin: 0; height: 100%; background: var(--ground); }
  main { position: absolute; inset: 0; }
  /* A pinch or double tap on the map is the map's, never the page's, even before the map script has run. */
  #map { touch-action: none; }
  /* Nothing that reads as a browser (DESIGN.md): no pull-to-refresh or bounce (iOS needs it on html too), no gray tap flash. */
  html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  body { font-family: Overpass, system-ui, sans-serif; }
  #steps { position: absolute; left: max(12px, env(safe-area-inset-left)); bottom: max(28px, calc(env(safe-area-inset-bottom) + 20px)); display: flex; align-items: center;
    background: var(--card); border-radius: 22px; box-shadow: 0 1px 8px rgb(0 0 0 / 0.28); -webkit-touch-callout: none; user-select: none; }
  #steps button { all: unset; touch-action: manipulation; width: 44px; height: 44px; text-align: center; font-size: 24px; line-height: 44px; color: var(--ink); cursor: pointer; }
  #steps button:disabled { color: var(--quiet); opacity: 0.5; }
  #steps button:focus-visible { outline: 2px solid var(--ink); outline-offset: -3px; border-radius: 22px; }
  /* Said to a screen reader, not shown. */
  .sr, #card .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #sheets { display: flex; gap: 6px; padding: 0 2px; }
  #sheets i { width: 5px; height: 5px; border-radius: 50%; background: var(--quiet); opacity: 0.5; }
  #sheets i.on { background: var(--ink); opacity: 1; }
  #credit { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(8px, env(safe-area-inset-bottom)); font-size: 10px; color: var(--note); padding: 2px 6px; margin-left: -6px; border-radius: 8px; background: color-mix(in srgb, var(--ground) 82%, transparent); }
  #credit a { color: inherit; }
  #card { position: absolute; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); bottom: max(84px, calc(env(safe-area-inset-bottom) + 76px)); max-width: 420px; padding: 12px 14px; background: var(--card); color: var(--ink);
    border-radius: 14px; box-shadow: 0 1px 8px rgb(0 0 0 / 0.28); }
  #card[hidden] { display: none; }
  #card b { display: block; padding-right: 26px; font-size: 15px; font-weight: 700; line-height: 1.25; }
  #card span { display: block; margin-top: 3px; font-size: 12.5px; color: var(--note); line-height: 1.3; }
  /* Closes the card as a tap on empty ground does, without having to find empty ground. */
  #card button.close { all: unset; position: absolute; top: 4px; right: 4px; width: 36px; height: 36px; border-radius: 18px; text-align: center;
    font-size: 22px; line-height: 36px; color: var(--note); cursor: pointer; touch-action: manipulation; }
  #card button.close:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }
  /* Each route on the card is a button: picking one draws it whole on every sheet, the rest faded (js/sheets/main.js). */
  #card .routes { display: flex; flex-wrap: wrap; gap: 6px; margin: 5px -4px 0; padding: 4px; max-height: 128px; overflow-y: auto; }
  #card .routes button { all: unset; box-sizing: border-box; touch-action: manipulation; cursor: pointer; min-width: 36px; height: 32px; padding: 0 10px; border-radius: 16px;
    text-align: center; font-size: 14px; font-weight: 700; line-height: 33px; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--rim); font-variant-numeric: tabular-nums; }
  #card .routes button.rail { min-width: 32px; padding: 0; box-shadow: none; font-weight: 800; }
  #card .routes button[aria-pressed="true"] { background: var(--ink); color: var(--card); box-shadow: none; }
  #card .routes button.rail[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ink); }
  #card .routes button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* In a stop-group row the routes sit beside their letter, a row of the same buttons. */
  #card .rows .routes { margin: 0; padding: 2px; max-height: none; gap: 5px; }
  #card span.hint { margin-top: 4px; font-size: 11.5px; }
  #card span.hint:empty { display: none; }
  #card i { display: inline-block; min-width: 1.5em; height: 1.5em; margin-right: 6px; border-radius: 0.75em; text-align: center; font-style: normal; line-height: 1.55em; }
  /* A stop group's routes, a row per letter: the letter in a small square of ink, as on the map. */
  #card .rows { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 5px 8px; margin-top: 8px; font-size: 14px; font-weight: 600; }
  #card .rows i { min-width: 18px; height: 18px; margin: 0; border-radius: 4px; background: var(--ink); color: var(--card); font-size: 11.5px; font-weight: 700; line-height: 19px; }
  #card .rows em { font-style: normal; word-spacing: 0.15em; }
  /* While the map loads: a picture of the view it opens on, centred as the map is, and a line saying so (scripts/poster.mjs). */
  /* Touches go through the picture to the map under it: a pinch on the picture zoomed the page, not the map. */
  #poster { position: absolute; inset: 0; overflow: hidden; background: var(--ground); transition: opacity 250ms ease-out; pointer-events: none; }
  #poster img { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: none; user-select: none; -webkit-user-drag: none;
    opacity: 0; transition: opacity 200ms ease-out; }
  #poster img.whole { opacity: 1; }
  #poster.gone { opacity: 0; pointer-events: none; }
  #loading { position: absolute; left: 50%; top: max(16px, calc(env(safe-area-inset-top) + 10px)); transform: translateX(-50%); margin: 0; padding: 7px 15px 6px;
    background: var(--card); color: var(--ink); border-radius: 16px; box-shadow: 0 1px 8px rgb(0 0 0 / 0.28); font-size: 13px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; }
  #loading span { animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { #poster, #poster img { transition: none; } #loading span { animation: none; } }
</style>
</head>
<body>
<main>
<div id="map"></div>
<!-- What a tap names. Next after the map, so a screen reader reaches it from there (#14). -->
<div id="card" role="region" aria-labelledby="card-title" hidden></div>
<div id="poster" data-view="10/39.7192/-105.0018" data-bounds="-105.8841,39.1565,-104.3693,40.5067">
  <picture>
    <source media="(max-width: 600px) and (prefers-color-scheme: dark)" srcset="/poster/phone-dark.webp 2x">
    <source media="(max-width: 600px)" srcset="/poster/phone-light.webp 2x">
    <source media="(prefers-color-scheme: dark)" srcset="/poster/wide-dark-1x.webp 1x, /poster/wide-dark-2x.webp 2x">
    <img src="/poster/wide-light-1x.webp" srcset="/poster/wide-light-1x.webp 1x, /poster/wide-light-2x.webp 2x" alt="" fetchpriority="high" draggable="false">
  </picture>
  <p id="loading" role="status"><span>Loading…</span></p>
</div>
<script>
  // The picture is of the opening view in the reader's theme: not of a view a link names, nor a theme the address forces.
  (() => {
    const poster = document.getElementById('poster');
    const [z, lat, lon] = poster.dataset.view.split('/').map(Number);
    const [hz, hlat, hlon] = location.hash.slice(1).split('/').map(Number);
    const elsewhere = Number.isFinite(hlon) && (Math.abs(hz - z) > 0.01 || Math.abs(hlat - lat) > 0.002 || Math.abs(hlon - lon) > 0.002);
    if (!Number.isFinite(lon) || elsewhere || new URLSearchParams(location.search).has('theme')) return poster.querySelector('picture').remove();
    // Where the map will put the view's middle: a screen wider than the map's bounds allow round
    // it has the map shifted in from that edge (MapLibre's maxBounds), and the picture goes with it.
    const [west, south, east, north] = poster.dataset.bounds.split(',').map(Number);
    const world = 512 * 2 ** z;
    const x = (lng) => ((lng + 180) / 360) * world;
    const y = (la) => ((180 - (180 / Math.PI) * Math.log(Math.tan(Math.PI / 4 + (la * Math.PI) / 360))) / 360) * world;
    const fit = (c, lo, hi, half) => (hi - lo < 2 * half ? (lo + hi) / 2 : Math.min(Math.max(c, lo + half), hi - half));
    const img = poster.querySelector('img');
    const place = () => {
      if (![west, south, east, north].every(Number.isFinite)) return;
      const dx = x(lon) - fit(x(lon), x(west), x(east), innerWidth / 2);
      const dy = y(lat) - fit(y(lat), y(north), y(south), innerHeight / 2);
      img.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    };
    place();
    addEventListener('resize', place);
    // Shown whole, not drawn in strips as it arrives.
    const whole = () => img.classList.add('whole');
    if (img.complete && img.naturalWidth) whole();
    else img.addEventListener('load', whole);
  })();
</script>
<div id="steps" role="group" aria-label="Map sheet">
  <!-- As the page opens, on the widest sheet; the script sets these for a link to another. -->
  <button id="out" aria-label="Wider sheet" disabled>&minus;</button>
  <div id="sheets" role="img" aria-label="Sheet 1 of 4"><i class="on"></i><i></i><i></i><i></i></div>
  <button id="in" aria-label="Closer sheet">+</button>
</div>
<p id="say" class="sr" role="status"></p>
</main>
<footer id="credit">Unofficial. Data: RTD · <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · <a href="https://openfreemap.org">OpenFreeMap</a></footer>
<script type="module" src="/js/sheets/main.js"></script>
</body>
</html>
